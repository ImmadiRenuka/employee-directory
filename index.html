
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Employee Directory" />
  <title>Employee Directory</title>
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <header class="header">
    <h1>Employee Directory</h1>
    <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main class="container">
    <section class="toolbar">
      <button id="favorites-toggle" aria-pressed="false">
           ❤️ Show Favorites
         </button>
      <input
        type="search"
        id="search-input"
        placeholder="Search employees by name..."
        aria-label="Search employees"
      />

      <select id="department-filter" aria-label="Filter by department">
        <option value="all">All Departments</option>
      </select>

      <select id="sort-select" aria-label="Sort employees">
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
      </select>
    </section>

    <section class="directory-section">
      <div class="section-heading">
        <h2>Our Employees</h2>
        <p id="employee-count">Loading employees...</p>
      </div>

      <div id="employee-list" class="employee-grid" aria-live="polite">
        <p>Loading employees...</p>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
